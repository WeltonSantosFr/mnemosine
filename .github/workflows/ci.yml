name: CI — Quality & Regression Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Lint, Types, Tests, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        run: pnpm tsc --noEmit

      - name: ESLint Code Quality
        run: pnpm lint

      - name: Vitest (Unit, Integration & Bug Regression)
        run: pnpm test

      - name: Next.js Production Build
        run: pnpm build

  visual-regression:
    name: Visual Regression (Playwright Full-Matrix)
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if visual snapshots baseline exists
        id: check-snapshots
        run: |
          if [ -d "tests/e2e-visual/snapshots" ] && [ "$(ls -A tests/e2e-visual/snapshots 2>/dev/null)" ]; then
            echo "has_snapshots=true" >> $GITHUB_OUTPUT
            echo "Snapshots de baseline encontrados. Executando suíte visual..."
          else
            echo "has_snapshots=false" >> $GITHUB_OUTPUT
            echo "::notice title=Playwright Visual::Nenhum baseline de snapshot visual encontrado em tests/e2e-visual/snapshots. Gere os baselines oficiais com 'pnpm test:visual:docker' para ativar a validação estrita de layout."
          fi

      - name: Install Playwright Chromium with system dependencies
        if: steps.check-snapshots.outputs.has_snapshots == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Visual Regression
        if: steps.check-snapshots.outputs.has_snapshots == 'true'
        run: pnpm test:visual

      - name: Upload Playwright Report on Failure
        if: failure() && steps.check-snapshots.outputs.has_snapshots == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 7
